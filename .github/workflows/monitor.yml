name: ICML hotel monitor

# Reliability design: GitHub's scheduled cron is unreliable for short intervals, so instead of
# relying on it we run a long-lived job that checks every 5 min via an internal loop (exact sleep).
# At the end of its window the job re-launches itself (workflow_dispatch via GITHUB_TOKEN, which is
# exempt from the no-recursion rule), giving near-seamless handoff. The schedule below is only a
# keepalive that recovers coverage if a chain ever dies. Public repo => unlimited free Actions minutes.

on:
  schedule:
    - cron: "8,23,38,53 * * * *"   # keepalive ~every 15 min (off the :00/:30 peak marks)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a TEST ntfy alert instead of monitoring"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: icml-hotel-monitor
  cancel-in-progress: false      # never kill a running chain; extra triggers wait as a single pending run

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350           # under the 6h hard limit; loop exits at ~330 min, leaving room to hand off
    steps:
      - uses: actions/checkout@v5

      - name: Test alert (manual --test only)
        if: ${{ inputs.test == true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 check.py --test

      - name: Monitor loop — check every 5 min
        if: ${{ inputs.test != true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set +e
          git config user.name "icml-hotel-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          END=$(( $(date +%s) + 330*60 ))   # ~5.5h window, then hand off to the next chain
          n=0
          while [ "$(date +%s)" -lt "$END" ]; do
            n=$((n+1))
            echo "----- check #$n  $(date -u +%FT%TZ) -----"
            python3 check.py
            if ! git diff --quiet -- state.json; then
              git add state.json
              git commit -m "state: $(date -u +%FT%TZ)"
              git push || { git pull --rebase --autostash && git push; } || echo "push failed (continuing)"
            fi
            sleep 300
          done
          echo "window complete; handing off to next cycle"

      - name: Re-launch next cycle (chain handoff)
        if: ${{ inputs.test != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "ICML hotel monitor" --ref main \
            && echo "next cycle dispatched" \
            || echo "redispatch failed; the keepalive cron will recover coverage"
