name: ICML hotel monitor

on:
  schedule:
    # Every ~5 min (GitHub's minimum). Actual firing may be delayed under load.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: icml-hotel-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check availability
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 check.py

      - name: Persist state on change
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "icml-hotel-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u +%FT%TZ)"
            git push
          else
            echo "no state change"
          fi
